
{% extends "layout.html" %}

{% block title %}Registrieren{% endblock %}

{% block main %}
<div class="container section">
    <h1 class="section-title">Kostenfrei registrieren</h1>
    <div class="row justify-content-center">
        <div class="col-md-6">
            <form>
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="email" placeholder="name@example.com">
                    <label for="email">E-Mail-Adresse</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="password" placeholder="Passwort">
                    <label for="password">Passwort</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="confirmation" placeholder="Passwort bestätigen">
                    <label for="confirmation">Passwort bestätigen</label>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">Registrieren</button>
                </div>
            </form>
            <hr class="my-4">
            <p class="text-center">Bereits registriert? <a href="{{ url_for('login') }}">Jetzt anmelden</a></p>
        </div>
    </div>
</div>
{% endblock %}
