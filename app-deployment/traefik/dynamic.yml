# =============================================================================
# Traefik Dynamic Configuration for NGÜ App
# =============================================================================
# 
# This file contains dynamic routing rules that can be updated without
# restarting Traefik. It's watched by Traefik and reloaded automatically.
# =============================================================================

http:
  middlewares:
    # Custom error handling for specific endpoints
    ngue-error-handler:
      errors:
        status:
          - "500-599"
        service: "ngue-app"
        query: "/error/{status}"

    # CORS headers for API endpoints
    api-cors:
      headers:
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "OPTIONS"
        accessControlAllowOriginList:
          - "https://ngue.familieprobst.org"
        accessControlAllowHeaders:
          - "Content-Type"
          - "Authorization"
          - "X-Requested-With"
          - "X-CSRF-Token"
        accessControlMaxAge: 86400

    # Special handling for Stripe webhooks
    stripe-webhook:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: "https"
          X-Real-IP: ""
      rateLimit:
        burst: 10
        average: 5
        period: "1m"

    # Cache control for static assets
    static-cache:
      headers:
        customResponseHeaders:
          Cache-Control: "public, max-age=31536000"
          Expires: "Thu, 31 Dec 2037 23:55:55 GMT"

    # No cache for dynamic content
    no-cache:
      headers:
        customResponseHeaders:
          Cache-Control: "no-cache, no-store, must-revalidate"
          Pragma: "no-cache"
          Expires: "0"

    # Circuit breaker for resilience
    circuit-breaker:
      circuitBreaker:
        expression: "NetworkErrorRatio() > 0.3"
        checkPeriod: "3s"
        fallbackDuration: "10s"
        recoveryDuration: "30s"

    # Retry middleware
    retry:
      retry:
        attempts: 3
        initialInterval: "100ms"

  routers:
    # API routes with CORS and rate limiting
    ngue-api:
      rule: "Host(`ngue.familieprobst.org`) && PathPrefix(`/api/`)"
      entryPoints:
        - "websecure"
      service: "ngue-app"
      middlewares:
        - "api-cors"
        - "rate-limit-api@file"
        - "no-cache"
        - "circuit-breaker"
      tls:
        certResolver: "letsencrypt"

    # Stripe webhook with special handling
    ngue-stripe-webhook:
      rule: "Host(`ngue.familieprobst.org`) && PathPrefix(`/stripe/webhook`)"
      entryPoints:
        - "websecure"
      service: "ngue-app"
      middlewares:
        - "stripe-webhook"
        - "no-cache"
      tls:
        certResolver: "letsencrypt"

    # Static assets with caching
    ngue-static:
      rule: "Host(`ngue.familieprobst.org`) && PathPrefix(`/static/`)"
      entryPoints:
        - "websecure"
      service: "nginx@docker"
      middlewares:
        - "static-cache"
        - "compression@file"
      tls:
        certResolver: "letsencrypt"

    # Main application with rate limiting and security
    ngue-main:
      rule: "Host(`ngue.familieprobst.org`)"
      entryPoints:
        - "websecure"
      service: "ngue-app"
      middlewares:
        - "default-headers@file"
        - "secure-headers@file"
        - "rate-limit-general@file"
        - "no-cache"
        - "compression@file"
        - "circuit-breaker"
        - "retry"
      tls:
        certResolver: "letsencrypt"

    # Health check endpoint (no rate limiting)
    ngue-health:
      rule: "Host(`ngue.familieprobst.org`) && PathPrefix(`/health`)"
      entryPoints:
        - "web"
        - "websecure"
      service: "ngue-app"
      middlewares:
        - "no-cache"

# TLS Configuration
tls:
  stores:
    default:
      defaultGeneratedCert:
        resolver: "letsencrypt"
        domain:
          main: "ngue.familieprobst.org"
          sans:
            - "*.ngue.familieprobst.org"

