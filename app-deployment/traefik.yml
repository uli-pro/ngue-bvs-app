# =============================================================================
# Simplified Traefik Configuration for NGÜ Bibelvers-Sponsoring App
# =============================================================================
# 
# Minimal configuration focusing on essentials only.
# All routing is handled via Docker labels.
#
# =============================================================================

# Global Configuration
global:
  checkNewVersion: false
  sendAnonymousUsage: false

# API and Dashboard
api:
  dashboard: true
  insecure: false  # Dashboard requires authentication

# Entrypoints (HTTP and HTTPS)
entryPoints:
  web:
    address: ":80"
  
  websecure:
    address: ":443"

# Certificate Resolvers
certificatesResolvers:
  letsencrypt:
    acme:
      email: "uli@familieprobst.org"
      storage: "/letsencrypt/acme.json"
      # Use DNS challenge for Cloudflare
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"
        delayBeforeCheck: 60

# Providers
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: "ngue-network"

# Logging
log:
  level: "INFO"

# Access Logs
accessLog:
  enabled: true

# Ping endpoint for health checks
ping:
  entryPoint: "web"