version: '3.8'

services:
  # Traefik Reverse Proxy
  traefik:
    image: traefik:v3.0
    container_name: traefik-ngue
    restart: unless-stopped
    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=ngue-network
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare
      - --log.level=INFO
      - --accesslog=true
    environment:
      - CLOUDFLARE_DNS_API_TOKEN=${CLOUDFLARE_DNS_API_TOKEN}
    ports:
      - "8090:80"
      - "8091:443"
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/letsencrypt:/letsencrypt
      - ./traefik:/etc/traefik:ro
    networks:
      - ngue-network
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL mit pgvector
  postgres:
    image: pgvector/pgvector:pg15
    container_name: ngue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - ngue-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    expose:
      - "5432"

  # NGÜ Flask Application
  ngue-app:
    build:
      context: ..
      dockerfile: app-deployment/Dockerfile
      target: production
    container_name: ngue-flask-app
    restart: unless-stopped
    environment:
      # Docker flag
      - DOCKER_DEPLOYMENT=1
      
      # Flask
      - FLASK_ENV=production
      - FLASK_APP=app.py
      - SECRET_KEY=${SECRET_KEY}
      
      # Database
      - SQLALCHEMY_DATABASE_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      
      # Stripe
      - STRIPE_PUBLIC_KEY=${STRIPE_PUBLIC_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      
      # OpenAI
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      
      # Email
      - EMAIL_PROVIDER=${EMAIL_PROVIDER}
      - MAILGUN_API_KEY=${MAILGUN_API_KEY}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN}
      - MAILGUN_FROM_EMAIL=${MAILGUN_FROM_EMAIL}
      - GMAIL_USERNAME=${GMAIL_USERNAME}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME}
      - EMAIL_REPLY_TO=${EMAIL_REPLY_TO}
      
      # Admin
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      
      # App Config
      - DOMAIN_NAME=${DOMAIN_NAME}
      - VERSES_PER_PAGE=20
      - DONATION_AMOUNT=100
      - CURRENCY=EUR
    volumes:
      - ../certificates:/app/certificates
      - ../flask_session:/app/flask_session
      - ./logs:/app/logs
    networks:
      - ngue-network
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ngue-http.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.ngue-http.entrypoints=web"
      - "traefik.http.routers.ngue-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"
      - "traefik.http.routers.ngue-https.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.ngue-https.entrypoints=websecure"
      - "traefik.http.routers.ngue-https.tls=true"
      - "traefik.http.routers.ngue-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.ngue-service.loadbalancer.server.port=5000"
      - "traefik.http.services.ngue-service.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.ngue-service.loadbalancer.healthcheck.interval=30s"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Nginx für statische Dateien
  nginx:
    image: nginx:alpine
    container_name: ngue-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../static:/usr/share/nginx/html/static:ro
    networks:
      - ngue-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ngue-static.rule=Host(`${DOMAIN_NAME}`) && PathPrefix(`/static/`)"
      - "traefik.http.routers.ngue-static.entrypoints=websecure"
      - "traefik.http.routers.ngue-static.tls=true"
      - "traefik.http.routers.ngue-static.tls.certresolver=letsencrypt"
      - "traefik.http.services.ngue-static.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    expose:
      - "80"

volumes:
  postgres_data:
    driver: local

networks:
  ngue-network:
    driver: bridge