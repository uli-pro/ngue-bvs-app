# =============================================================================
# Nginx Configuration for NGÜ Static Files
# =============================================================================
# 
# This configuration serves static files (CSS, JS, images) with optimal
# caching and compression for the NGÜ Bibelvers-Sponsoring App.
#
# Features:
# - Efficient static file serving
# - Gzip compression
# - Long-term caching headers
# - Security headers
# - Access logging
# =============================================================================

# Main configuration
user nginx;
worker_processes auto;
worker_rlimit_nofile 8192;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Events configuration
events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

# HTTP configuration
http {
    # Basic settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    charset utf-8;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    client_max_body_size 2M;
    
    # Security settings
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Logging configuration
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    '$request_time $upstream_response_time';
    
    access_log /var/log/nginx/access.log main;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/woff
        font/woff2;
    
    # Brotli compression (if available)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    
    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=static:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    
    # Cache configuration
    map $sent_http_content_type $expires {
        default                    off;
        text/html                  epoch;
        text/css                   max;
        application/javascript     max;
        application/json           epoch;
        ~image/                    1M;
        ~font/                     1M;
    }
    
    expires $expires;
    
    # Server configuration for static files
    server {
        listen 80;
        server_name _;
        
        # Root directory for static files
        root /usr/share/nginx/html;
        index index.html;
        
        # Security headers
        add_header X-Served-By "NGÜ-Static" always;
        add_header Cache-Control "public, immutable" always;
        
        # Rate limiting
        limit_req zone=static burst=20 nodelay;
        limit_conn conn_limit_per_ip 10;
        
        # Static file serving
        location /static/ {
            alias /usr/share/nginx/html/static/;
            
            # Cache configuration for different file types
            location ~* \.(css|js)$ {
                add_header Cache-Control "public, max-age=31536000, immutable";
                gzip_static on;
            }
            
            location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
                add_header Cache-Control "public, max-age=2592000"; # 30 days
                expires 30d;
            }
            
            location ~* \.(woff|woff2|ttf|eot)$ {
                add_header Cache-Control "public, max-age=31536000, immutable";
                add_header Access-Control-Allow-Origin "*";
                expires 1y;
            }
            
            location ~* \.(pdf|doc|docx)$ {
                add_header Cache-Control "public, max-age=86400"; # 1 day
                expires 1d;
            }
            
            # Security: Deny access to sensitive files
            location ~* \.(php|pl|py|jsp|asp|sh|cgi)$ {
                return 444;
            }
            
            location ~* /\. {
                deny all;
            }
            
            # Try files or return 404
            try_files $uri =404;
        }
        
        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # Favicon handling
        location = /favicon.ico {
            alias /usr/share/nginx/html/static/images/favicon.ico;
            log_not_found off;
            access_log off;
            expires 30d;
        }
        
        # Robots.txt
        location = /robots.txt {
            alias /usr/share/nginx/html/static/robots.txt;
            log_not_found off;
            access_log off;
            expires 1d;
        }
        
        # Deny access to hidden files and directories
        location ~ /\. {
            deny all;
            return 444;
        }
        
        # Deny access to backup and temporary files
        location ~* \.(bak|backup|old|tmp|temp|log|cache)$ {
            deny all;
            return 444;
        }
        
        # Default location - should not be accessed directly
        location / {
            return 404;
        }
        
        # Custom error pages
        error_page 404 /static/404.html;
        error_page 500 502 503 504 /static/50x.html;
        
        location = /static/404.html {
            internal;
        }
        
        location = /static/50x.html {
            internal;
        }
    }
    
    # Additional server block for metrics (optional)
    server {
        listen 8080;
        server_name localhost;
        
        # Restrict access to localhost only
        allow 127.0.0.1;
        allow ::1;
        deny all;
        
        # Basic status page
        location /nginx_status {
            stub_status on;
            access_log off;
        }
        
        # Health check for container orchestration
        location /health {
            access_log off;
            return 200 "nginx healthy\n";
            add_header Content-Type text/plain;
        }
    }
}

