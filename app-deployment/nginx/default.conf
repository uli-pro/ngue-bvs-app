# =============================================================================
# NGÜ BVS App - Nginx Configuration (nach Domain-Migration)
# =============================================================================
# Handles: SSL termination, static files, reverse proxy, security headers
# Domains: vers-patenschaft.de (primary), ngue-bvs.schoeffer.org (301 redirect)
# Auto-renewal: Certbot renews certificates, Nginx reloads every 6 hours
# =============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=stripe:10m rate=5r/s;

# Upstream configuration for Flask app
upstream flask_app {
    server app:5000 max_fails=3 fail_timeout=30s;
}

# =============================================================================
# 1. ALTE DOMAIN: ngue-bvs.schoeffer.org → 301 Redirect (DAUERHAFT!)
# =============================================================================
# Diese Blöcke MÜSSEN aktiv bleiben (mindestens 1 Jahr, idealerweise unbegrenzt).
# Alte Zertifikate werden weiterhin von Certbot erneuert.

# HTTP → Redirect direkt zur neuen Domain
server {
    listen 80;
    listen [::]:80;
    server_name ngue-bvs.schoeffer.org www.ngue-bvs.schoeffer.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://vers-patenschaft.de$request_uri;
    }
}

# HTTPS → Redirect (braucht altes Zertifikat!)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ngue-bvs.schoeffer.org www.ngue-bvs.schoeffer.org;

    ssl_certificate /etc/letsencrypt/live/ngue-bvs.schoeffer.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ngue-bvs.schoeffer.org/privkey.pem;

    return 301 https://vers-patenschaft.de$request_uri;
}

# =============================================================================
# 2. NEUE DOMAIN: vers-patenschaft.de
# =============================================================================

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name vers-patenschaft.de www.vers-patenschaft.de;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://vers-patenschaft.de$request_uri;
    }
}

# www → non-www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.vers-patenschaft.de;

    ssl_certificate /etc/letsencrypt/live/vers-patenschaft.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vers-patenschaft.de/privkey.pem;

    return 301 https://vers-patenschaft.de$request_uri;
}

# Hauptserver
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vers-patenschaft.de;

    # -------------------------------------------------------------------------
    # SSL Configuration (Mozilla Intermediate)
    # -------------------------------------------------------------------------
    ssl_certificate /etc/letsencrypt/live/vers-patenschaft.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vers-patenschaft.de/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/vers-patenschaft.de/chain.pem;

    # SSL Sessions
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 1.0.0.1 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # -------------------------------------------------------------------------
    # Security Headers
    # -------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' https://js.stripe.com https://cdn.jsdelivr.net https://analytics.vers-patenschaft.de; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://api.stripe.com https://cdn.jsdelivr.net https://analytics.vers-patenschaft.de; frame-src https://js.stripe.com https://hooks.stripe.com;" always;

    # -------------------------------------------------------------------------
    # General Configuration
    # -------------------------------------------------------------------------
    client_max_body_size 10M;
    client_body_buffer_size 128k;
    client_body_timeout 120s;
    keepalive_timeout 65;
    send_timeout 120s;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml application/atom+xml image/svg+xml text/x-js text/x-cross-domain-policy application/x-font-ttf application/x-font-opentype application/vnd.ms-fontobject font/opentype;

    # -------------------------------------------------------------------------
    # Wartungsmodus (file-basiert)
    # -------------------------------------------------------------------------
    # Aktivieren:  docker compose exec nginx touch /usr/share/nginx/html/static/maintenance_on && docker compose exec nginx nginx -s reload
    # Deaktivieren: docker compose exec nginx rm /usr/share/nginx/html/static/maintenance_on && docker compose exec nginx nginx -s reload
    set $maintenance 0;
    if (-f /usr/share/nginx/html/static/maintenance_on) {
        set $maintenance 1;
    }

    error_page 503 /static/maintenance.html;
    location = /static/maintenance.html {
        root /usr/share/nginx/html;
        internal;
    }

    # -------------------------------------------------------------------------
    # Location Blocks
    # -------------------------------------------------------------------------

    # Static files - served directly by Nginx (NICHT vom Wartungsmodus betroffen)
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 30d;
        add_header Cache-Control "public, immutable" always;

        # Security headers for static files
        add_header X-Content-Type-Options "nosniff" always;

        # Disable access logs for static files
        access_log off;
    }

    # Favicon - cached aggressively
    location /favicon.ico {
        alias /usr/share/nginx/html/static/favicon.ico;
        expires 1y;
        access_log off;
        log_not_found off;
    }

    # Robots.txt
    location /robots.txt {
        alias /usr/share/nginx/html/static/robots.txt;
        access_log off;
        log_not_found off;
    }

    # Health check endpoint (no rate limiting, NICHT vom Wartungsmodus betroffen)
    location /health {
        proxy_pass http://flask_app/health;
        access_log off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Stripe webhook endpoint (NICHT vom Wartungsmodus betroffen!)
    # Nginx wählt die längste prefix-Übereinstimmung. Weil /stripe/webhook
    # spezifischer ist als /, greift dieser Block auch im Wartungsmodus.
    location /stripe/webhook {
        # Lower rate limit for webhooks
        limit_req zone=stripe burst=10 nodelay;

        proxy_pass http://flask_app/stripe/webhook;

        # Stripe webhooks need raw body
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Important for Stripe signature verification
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Longer timeout for webhook processing
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # API endpoints (higher rate limit)
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://flask_app;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS headers
        add_header Access-Control-Allow-Origin "https://vers-patenschaft.de" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    }

    # Main application (default) — Wartungsmodus greift hier
    location / {
        if ($maintenance) {
            return 503;
        }

        # General rate limiting
        limit_req zone=general burst=20 nodelay;

        proxy_pass http://flask_app;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Proxy settings
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# =============================================================================
# 3. ANALYTICS: Alte Domain → Redirect, neue Domain → Plausible
# =============================================================================

# Alte Analytics-Domain HTTP → Redirect
server {
    listen 80;
    listen [::]:80;
    server_name analytics.schoeffer.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://analytics.vers-patenschaft.de$request_uri;
    }
}

# Alte Analytics-Domain HTTPS → Redirect (braucht altes Zertifikat!)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name analytics.schoeffer.org;

    ssl_certificate /etc/letsencrypt/live/analytics.schoeffer.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/analytics.schoeffer.org/privkey.pem;

    return 301 https://analytics.vers-patenschaft.de$request_uri;
}

# Neue Analytics-Domain HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name analytics.vers-patenschaft.de;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://analytics.vers-patenschaft.de$request_uri;
    }
}

# Neue Analytics-Domain HTTPS → Plausible Proxy
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name analytics.vers-patenschaft.de;

    ssl_certificate /etc/letsencrypt/live/analytics.vers-patenschaft.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/analytics.vers-patenschaft.de/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/analytics.vers-patenschaft.de/chain.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 1.0.0.1 valid=300s;
    resolver_timeout 5s;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        proxy_pass http://plausible-plausible-1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# =============================================================================
# 4. Default Server Block (catch-all)
# =============================================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Health check endpoint für Docker
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Alle anderen Requests abweisen
    location / {
        return 444;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/ssl/self-signed.crt;
    ssl_certificate_key /etc/nginx/ssl/self-signed.key;

    return 444;
}
