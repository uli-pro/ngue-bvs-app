# =============================================================================
# NGÜ BVS App - Nginx Configuration
# =============================================================================
# Handles: SSL termination, static files, reverse proxy, security headers
# Auto-renewal: Certbot renews certificates, Nginx reloads every 6 hours
# =============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=stripe:10m rate=5r/s;

# Upstream configuration for Flask app
upstream flask_app {
    server app:5000 max_fails=3 fail_timeout=30s;
}

# -----------------------------------------------------------------------------
# HTTP Server - Port 80
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ngue-bvs.schoeffer.org www.ngue-bvs.schoeffer.org;

    # Let's Encrypt ACME Challenge location
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# -----------------------------------------------------------------------------
# HTTPS Server - Port 443
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ngue-bvs.schoeffer.org www.ngue-bvs.schoeffer.org;

    # -------------------------------------------------------------------------
    # SSL Configuration (Mozilla Intermediate)
    # -------------------------------------------------------------------------
    ssl_certificate /etc/letsencrypt/live/ngue-bvs.schoeffer.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ngue-bvs.schoeffer.org/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/ngue-bvs.schoeffer.org/chain.pem;

    # SSL Sessions
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 1.0.0.1 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # -------------------------------------------------------------------------
    # Security Headers
    # -------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com;" always;

    # -------------------------------------------------------------------------
    # General Configuration
    # -------------------------------------------------------------------------
    client_max_body_size 10M;
    client_body_buffer_size 128k;
    client_body_timeout 120s;
    keepalive_timeout 65;
    send_timeout 120s;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml application/atom+xml image/svg+xml text/x-js text/x-cross-domain-policy application/x-font-ttf application/x-font-opentype application/vnd.ms-fontobject font/opentype;

    # -------------------------------------------------------------------------
    # Location Blocks
    # -------------------------------------------------------------------------

    # Static files - served directly by Nginx
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 30d;
        add_header Cache-Control "public, immutable" always;

        # Security headers for static files
        add_header X-Content-Type-Options "nosniff" always;

        # Disable access logs for static files
        access_log off;
    }

    # Favicon - cached aggressively
    location /favicon.ico {
        alias /usr/share/nginx/html/static/favicon.ico;
        expires 1y;
        access_log off;
        log_not_found off;
    }

    # Robots.txt
    location /robots.txt {
        alias /usr/share/nginx/html/static/robots.txt;
        access_log off;
        log_not_found off;
    }

    # Health check endpoint (no rate limiting)
    location /health {
        proxy_pass http://flask_app/health;
        access_log off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Stripe webhook endpoint (special handling)
    location /stripe/webhook {
        # Lower rate limit for webhooks
        limit_req zone=stripe burst=10 nodelay;

        proxy_pass http://flask_app/stripe/webhook;

        # Stripe webhooks need raw body
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Important for Stripe signature verification
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Longer timeout for webhook processing
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # API endpoints (higher rate limit)
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://flask_app;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS headers if needed
        add_header Access-Control-Allow-Origin "https://ngue-bvs.schoeffer.org" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    }

    # Main application (default)
    location / {
        # General rate limiting
        limit_req zone=general burst=20 nodelay;

        proxy_pass http://flask_app;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Proxy settings
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# -----------------------------------------------------------------------------
# Default Server Block (catch-all)
# -----------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Self-signed cert for default block
    ssl_certificate /etc/nginx/ssl/self-signed.crt;
    ssl_certificate_key /etc/nginx/ssl/self-signed.key;

    return 444;
}