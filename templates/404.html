{% extends "layout.html" %}

{% block title %}Seite nicht gefunden{% endblock %}

{% block main %}

<section class="section-padding">
    <div class="container">
        <div class="row">
            <div class="col-lg-6 mx-auto text-center">
                <div class="mb-4">
                    <i class="fas fa-exclamation-triangle text-warning" style="font-size: 5rem;"></i>
                </div>
                <h1 class="display-1 fw-bold text-primary">404</h1>
                <h2 class="mb-4">Seite nicht gefunden</h2>
                <p class="lead mb-4">
                    Die von Ihnen gesuchte Seite existiert leider nicht oder wurde verschoben.
                </p>
                <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                    <a href="/" class="btn btn-primary btn-lg px-4 gap-3">Zur Startseite</a>
                    <a href="/kontakt" class="btn btn-outline-secondary btn-lg px-4">Kontakt</a>
                </div>
            </div>
        </div>
    </div>
</section>

{% endblock %}
