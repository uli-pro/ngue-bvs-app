<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NGÜ Bibelvers-Patenschaft{% endblock %}</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .header {
            background: linear-gradient(135deg, #2c5aa0 0%, #1e3a72 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 300;
        }
        .content {
            padding: 40px 30px;
        }
        .footer {
            padding: 25px 30px;
            font-size: 14px;
            color: #666;
            background-color: #f8f9fa;
            text-align: center;
            border-top: 1px solid #dee2e6;
        }
        .button {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #2c5aa0 0%, #1e3a72 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            margin: 20px 0;
        }
        .highlight {
            background-color: #e8f4fd;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #2c5aa0;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="header">
            <h1>{% block header %}NGÜ Bibelvers-Patenschaft{% endblock %}</h1>
        </div>
        <div class="content">
            {% block content %}{% endblock %}
        </div>
        <div class="footer">
            <p><strong>Peter-Schöffer-Stiftung</strong><br>
            NGÜ Bibelvers-Patenschaft<br>
            <a href="https://vers-patenschaft.de" style="color: #2c5aa0;">vers-patenschaft.de</a></p>
            <p style="margin-top: 15px; font-size: 12px; color: #999;">
                {% block footer_text %}Dies ist eine automatisch generierte E-Mail.{% endblock %}
            </p>
        </div>
    </div>
</body>
</html>
