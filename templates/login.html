{% extends "layout.html" %}

{% block title %}Anmelden{% endblock %}

{% block main %}

<section class="section-padding">
    <div class="container">
        <div class="row">
            <div class="col-lg-5 mx-auto">
                <div class="card">
                    <div class="card-body p-4">
                        <h2 class="text-center mb-4">Anmelden</h2>
                        
                        <form method="POST" action="/login" class="needs-validation" novalidate>
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                            <div class="mb-3">
                                <label for="email" class="form-label">E-Mail-Adresse</label>
                                <input type="email" class="form-control" id="email" name="email" required autofocus>
                                <div class="invalid-feedback">
                                    Bitte geben Sie Ihre E-Mail-Adresse ein.
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="password" class="form-label">Passwort</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                                <div class="invalid-feedback">
                                    Bitte geben Sie Ihr Passwort ein.
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="remember" name="remember">
                                    <label class="form-check-label" for="remember">
                                        Angemeldet bleiben
                                    </label>
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100 mb-3">Anmelden</button>
                            
                            <div class="text-center">
                                <a href="{{ url_for('password_reset_request') }}" class="text-muted">Passwort vergessen?</a>
                            </div>
                        </form>
                        
                        <hr class="my-4">
                        
                        <p class="text-center text-muted mb-3">Noch kein Konto?</p>
                        <a href="/register" class="btn btn-outline-primary w-100">Jetzt registrieren</a>
                    </div>
                </div>
                
            </div>
        </div>
    </div>
</section>

{% endblock %}
