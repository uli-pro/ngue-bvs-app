<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Wartungsarbeiten - Vers-Patenschaft</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      :root {
        --color-primary: #2c5aa0;
        --color-secondary: #1a3a6b;
        --color-accent: #c8a45a;
      }
      body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #f5f7fa 0%, #e4e9f0 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .maintenance-card {
        max-width: 600px;
        border: none;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      }
      .maintenance-icon {
        color: var(--color-accent);
        font-size: 4rem;
      }
      h1 {
        color: var(--color-secondary);
        font-weight: 600;
      }
      .time-badge {
        background-color: var(--color-primary);
        color: white;
        padding: 0.5rem 1.2rem;
        border-radius: 50px;
        display: inline-block;
        font-weight: 500;
      }
      .footer-text {
        color: var(--color-primary);
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="container px-3">
      <div class="card maintenance-card mx-auto p-4 p-md-5">
        <div class="card-body text-center">
          <div class="maintenance-icon mb-4">
            <i class="fas fa-tools"></i>
          </div>

          <h1 class="h3 mb-3">Wartungsarbeiten</h1>

          <p class="text-muted mb-4">
            Wir arbeiten gerade an Verbesserungen an unserer Website.
            Die Seite ist in Kürze wieder erreichbar.
          </p>

          <div class="time-badge mb-4">
            <i class="fas fa-clock me-2"></i>Voraussichtlich ca. 30 Minuten
          </div>

          <hr class="my-4" />

          <p class="small text-muted mb-1">
            Bei dringenden Fragen erreichen Sie uns unter:
          </p>
          <p class="footer-text">
            <i class="fas fa-envelope me-1"></i>
            info@vers-patenschaft.de
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
