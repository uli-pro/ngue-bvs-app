version: '3.8'

services:
  # Traefik Reverse Proxy with SSL
  traefik:
    image: traefik:v3.0
    container_name: traefik-ngue
    restart: unless-stopped
    command:
      - --api.dashboard=true
      - --api.insecure=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # SSL Configuration
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare
      # Security headers
      - --entrypoints.websecure.http.middlewares=security-headers@docker
      # Logging
      - --log.level=INFO
      - --accesslog=true
    environment:
      - CLOUDFLARE_DNS_API_TOKEN=${CLOUDFLARE_DNS_API_TOKEN}
    ports:
      - "8090:80"
      - "8091:443"
      - "8080:8080"  # Traefik dashboard (optional, secure with auth)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
      - ./traefik:/etc/traefik:ro
    networks:
      - ngue-network
    labels:
      # Security headers middleware
      - "traefik.http.middlewares.security-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.security-headers.headers.sslredirect=true"
      - "traefik.http.middlewares.security-headers.headers.stsseconds=31536000"
      - "traefik.http.middlewares.security-headers.headers.stsincludesubdomains=true"
      - "traefik.http.middlewares.security-headers.headers.stspreload=true"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL with pgvector extension
  postgres:
    image: pgvector/pgvector:pg15
    container_name: ngue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Performance tuning
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
      - postgres_backups:/backups
    networks:
      - ngue-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # Security: No external ports exposed
    expose:
      - "5432"

  # Redis for session storage and caching
  redis:
    image: redis:7-alpine
    container_name: ngue-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - ngue-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Security: No external ports exposed
    expose:
      - "6379"

  # NGÜ Flask Application
  ngue-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ngue-flask-app
    restart: unless-stopped
    environment:
      # Flask Configuration
      - FLASK_ENV=production
      - FLASK_APP=app.py
      - SECRET_KEY=${SECRET_KEY}
      
      # Database Configuration
      - SQLALCHEMY_DATABASE_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      
      # Session Configuration (Redis)
      - SESSION_TYPE=redis
      - SESSION_REDIS=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SESSION_PERMANENT=False
      - SESSION_USE_SIGNER=True
      
      # Stripe Configuration
      - STRIPE_PUBLIC_KEY=${STRIPE_PUBLIC_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      
      # OpenAI Configuration (for semantic search)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      
      # Mail Configuration
      - MAIL_SERVER=${MAIL_SERVER}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USE_TLS=${MAIL_USE_TLS}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_DEFAULT_SENDER=${MAIL_DEFAULT_SENDER}
      
      # App-specific Configuration
      - DOMAIN_NAME=${DOMAIN_NAME}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      
      # Security
      - WTF_CSRF_TIME_LIMIT=3600
      - PERMANENT_SESSION_LIFETIME=3600
      
      # Performance
      - FLASK_SKIP_DOTENV=1
    volumes:
      - app_uploads:/app/uploads
      - app_logs:/app/logs
      - app_certs:/app/certificates
    networks:
      - ngue-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      # Traefik Configuration
      - "traefik.enable=true"
      
      # HTTP to HTTPS redirect
      - "traefik.http.routers.ngue-app-http.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.ngue-app-http.entrypoints=web"
      - "traefik.http.routers.ngue-app-http.middlewares=https-redirect"
      
      # HTTPS configuration
      - "traefik.http.routers.ngue-app.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.ngue-app.entrypoints=websecure"
      - "traefik.http.routers.ngue-app.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ngue-app.middlewares=security-headers"
      
      # Service configuration
      - "traefik.http.services.ngue-app.loadbalancer.server.port=5000"
      - "traefik.http.services.ngue-app.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.ngue-app.loadbalancer.healthcheck.interval=30s"
      
      # HTTPS redirect middleware
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Security: No external ports exposed
    expose:
      - "5000"

  # Nginx for static file serving (optional but recommended)
  nginx:
    image: nginx:alpine
    container_name: ngue-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/usr/share/nginx/html/static:ro
      - nginx_cache:/var/cache/nginx
    networks:
      - ngue-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ngue-static.rule=Host(`${DOMAIN_NAME}`) && PathPrefix(`/static/`)"
      - "traefik.http.routers.ngue-static.entrypoints=websecure"
      - "traefik.http.routers.ngue-static.tls.certresolver=letsencrypt"
      - "traefik.http.services.ngue-static.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Security: No external ports exposed
    expose:
      - "80"

  # Database initialization service (runs once)
  db-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: db-init
    container_name: ngue-db-init
    environment:
      - SQLALCHEMY_DATABASE_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./data:/app/data:ro
    networks:
      - ngue-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
    driver: local
  postgres_backups:
    driver: local
  redis_data:
    driver: local
  traefik_letsencrypt:
    driver: local
  app_uploads:
    driver: local
  app_logs:
    driver: local
  app_certs:
    driver: local
  nginx_cache:
    driver: local

networks:
  ngue-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16